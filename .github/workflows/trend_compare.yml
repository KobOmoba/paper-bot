name: trend-compare
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: trend-compare
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python trend_compare.py
      - name: Save report
        if: always()
        run: |
          set +e
          git config user.name "fx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f trend_compare_report.json
          git commit -m "trend compare report"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 5; done
