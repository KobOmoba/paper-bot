name: tokenized-stock-tracker
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 22:30 Lagos, after the US close
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: us-live
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python us_live.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          set +e
          git config user.name "us-tracker"
          git config user.email "bot@users.noreply.github.com"
          git add us_state.json
          git diff --cached --quiet && exit 0
          git commit -m "us tracker state"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 5; done
          echo "::error::could not push state"; exit 1
