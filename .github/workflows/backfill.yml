name: ngx-backfill
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: ngx-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - run: python ngx_backfill.py --days 520
      - run: python ngx_bot.py --backtest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngx-results
          path: |
            ngx_history.json
            ngx_raw.json
            backfill_report.json
            backtest_report.json
      - name: Save results to repo
        run: |
          set +e
          git config user.name "ngx-bot"
          git config user.email "bot@users.noreply.github.com"
          ls -la ngx_history.json ngx_raw.json backfill_report.json backtest_report.json > out.txt 2>&1
          git add -f ngx_history.json ngx_raw.json backfill_report.json backtest_report.json >> out.txt 2>&1
          git commit -m "NGX history backfill + backtest" >> out.txt 2>&1
          git pull --rebase --autostash >> out.txt 2>&1
          git push >> out.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then echo "::error::$(tr '\n' ' ' < out.txt | cut -c1-1500)"; exit 1; fi
