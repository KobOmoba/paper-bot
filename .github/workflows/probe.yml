name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber && python probe.py
      - run: |
          git config user.name "probe"
          git config user.email "bot@users.noreply.github.com"
          git add probe_report.json
          git diff --cached --quiet || (git commit -m "probe report" && git pull --rebase && git push)
