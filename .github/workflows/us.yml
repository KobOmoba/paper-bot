name: us-backtest
on:
  workflow_dispatch:
    inputs:
      full:
        description: fully invested
        default: 'false'
      dataset:
        description: us, crypto or small
        default: 'us'
      token_costs:
        description: tokenized-stock costs
        default: 'false'
permissions:
  contents: write
concurrency:
  group: ngx-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python us_backtest.py
        env:
          FULL: ${{ inputs.full }}
          DATASET: ${{ inputs.dataset }}
          TOKEN_COSTS: ${{ inputs.token_costs }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save report
        run: |
          set +e
          git config user.name "ngx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f *_backtest_report.json *_backtest_full_report.json *_rolling_report.json > out.txt 2>&1
          git commit -m "US backtest report" >> out.txt 2>&1
          git pull --rebase --autostash >> out.txt 2>&1
          git push >> out.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then echo "::error::$(tr '\n' ' ' < out.txt | cut -c1-1500)"; exit 1; fi
