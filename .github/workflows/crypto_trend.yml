name: crypto-trend-backtest
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: crypto-trend
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python crypto_trend.py
        env:
          MODE: backtest
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save report
        if: always()
        run: |
          set +e
          git config user.name "crypto-trend"
          git config user.email "bot@users.noreply.github.com"
          git add crypto_trend_report.json
          git diff --cached --quiet && exit 0
          git commit -m "crypto trend backtest report"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 5; done
