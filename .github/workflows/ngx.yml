name: ngx-bot
on:
  schedule:
    - cron: "0 15 * * 1-5"    # 16:00 Lagos, after the close + feed delay
    - cron: "30 17 * * 1-5"   # retry; harmless if already processed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ngx-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ngx_bot.py --debug
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "ngx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ngx_state.json
          git diff --cached --quiet || (git commit -m "ngx state" && git pull --rebase && git push)
