name: probe-kronos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: git clone --depth 1 https://github.com/shiyu-coder/Kronos Kronos_repo
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r Kronos_repo/requirements.txt yfinance pandas numpy
      - run: python probe_kronos.py
      - name: Save
        if: always()
        run: |
          set +e
          git config user.name "kronos-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f probe_kronos.json; git commit -m "kronos probe result"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 5; done
