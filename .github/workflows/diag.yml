name: meme-diagnostic
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: meme-diag
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets
      - name: Telegram test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -m 20 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Diagnostic: Telegram works from GitHub Actions. Scanner test results follow in the repo." > tg_test.json
          python3 -c "import json;d=json.load(open('tg_test.json'));print('telegram ok:',d.get('ok'),d.get('description',''))" | tee diag_output.txt
      - name: One scan per mode (scratch state, no Telegram)
        run: |
          set +e
          for M in v5 accel birth; do
            echo "=== MODE $M $(date -u +%T)" | tee -a diag_output.txt
            MEME_MODE=$M MEME_STATE_FILE=/tmp/diag_$M.json LOOP_MIN=0.6 SCAN_SEC=120 timeout 120 python meme_scanner.py 2>&1 | tail -40 | tee -a diag_output.txt
            echo "--- funnel:" | tee -a diag_output.txt
            python3 -c "import json;s=json.load(open('/tmp/diag_$M.json'));print(s['funnel'],'scans',s.get('scans'))" 2>&1 | tee -a diag_output.txt
          done
      - name: Save result
        if: always()
        run: |
          set +e
          rm -f tg_test.json
          git config user.name "diag-bot"
          git config user.email "bot@users.noreply.github.com"
          git add diag_output.txt
          git diff --cached --quiet && exit 0
          git commit -m "meme diagnostic output"
          for i in 1 2 3 4; do git pull --rebase --autostash && git push && exit 0; sleep 6; done
